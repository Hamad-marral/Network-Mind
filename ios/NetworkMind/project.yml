# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
name: NetworkMind
options:
  bundleIdPrefix: com.networkmind
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  NetworkMind:
    type: application
    platform: iOS
    sources:
      - path: NetworkMind
    info:
      path: NetworkMind/Info.plist
      properties:
        CFBundleDisplayName: NetworkMind
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
        # Usage descriptions: specific about what is read and why.
        NSContactsUsageDescription: "NetworkMind checks for contacts you newly add so it can remember when and where you met each person. Your address book stays on your device."
        NSLocationWhenInUseUsageDescription: "NetworkMind records the place where you met a new contact (for example, the venue name) so you can recall the meeting later. Location is captured once per new contact and stays on your device."
        NSCalendarsFullAccessUsageDescription: "NetworkMind reads your calendar to label new contacts with the event you were attending, such as a conference or meeting. It never changes your calendar."
        NSCameraUsageDescription: "NetworkMind uses the camera to scan business cards and fill in a contact's name, title, company, phone and email."
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.networkmind.app.contacts-refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.networkmind.app
        SWIFT_OBJC_BRIDGING_HEADER: NetworkMind/Support/NetworkMind-Bridging-Header.h
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        GENERATE_INFOPLIST_FILE: NO

  NetworkMindTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NetworkMindTests
    dependencies:
      - target: NetworkMind
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.networkmind.app.tests
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NetworkMind.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/NetworkMind
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  NetworkMind:
    build:
      targets:
        NetworkMind: all
        NetworkMindTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - NetworkMindTests
