name: iOS

on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  pull_request:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios/NetworkMind
    steps:
      - uses: actions/checkout@v4

      - name: Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick simulator
        id: sim
        run: echo "udid=$(xcrun simctl list devices available -j | python3 scripts/pick_simulator.py)" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          set +e
          xcodebuild test \
            -project NetworkMind.xcodeproj \
            -scheme NetworkMind \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            > xcodebuild.log 2>&1
          status=$?
          # Print only the interesting lines (errors, test results); full log is uploaded.
          grep -E "error:|Test Case .* (passed|failed)|\*\* (BUILD|TEST) (SUCCEEDED|FAILED) \*\*|Executed [0-9]+ test" xcodebuild.log | head -400
          # Surface compiler errors and test failures as annotations (readable via the
          # public check-runs API without downloading logs).
          python3 scripts/annotate_errors.py xcodebuild.log
          exit $status

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            ios/NetworkMind/xcodebuild.log
            ios/NetworkMind/TestResults.xcresult
          retention-days: 7
